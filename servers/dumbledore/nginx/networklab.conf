limit_req_zone $binary_remote_addr zone=terraform_plan:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oci_iam_policy:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=dns_lookup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=iam_validate:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name infralab.fuda.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://infralab.fuda.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name infralab.fuda.com.br;

    ssl_certificate /etc/letsencrypt/live/infralab.fuda.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infralab.fuda.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    limit_req_status 429;

    location = /api/dns {
        limit_req zone=dns_lookup burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /tools/dns {
        limit_req zone=dns_lookup burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/aws/iam-validate {
        client_max_body_size 32k;
        limit_req zone=iam_validate burst=3 nodelay;
        error_page 413 = @iam_too_large;
        error_page 429 = @iam_rate_limited;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ~ ^/api/(aws|oci)/terraform-plan-analyze$ {
        client_max_body_size 1m;
        limit_req zone=terraform_plan burst=3 nodelay;
        error_page 413 = @terraform_too_large;
        error_page 429 = @analysis_rate_limited;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/oci/iam-policy-analyze {
        client_max_body_size 32k;
        limit_req zone=oci_iam_policy burst=1 nodelay;
        error_page 413 = @oci_policy_too_large;
        error_page 429 = @analysis_rate_limited;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @terraform_too_large {
        default_type application/json;
        return 413 '{"detail":{"code":"PAYLOAD_TOO_LARGE","message":"The request body exceeds 1 MiB."}}';
    }

    location @oci_policy_too_large {
        default_type application/json;
        return 413 '{"detail":{"code":"PAYLOAD_TOO_LARGE","message":"The request body exceeds 32 KiB."}}';
    }

    location @analysis_rate_limited {
        default_type application/json;
        return 429 '{"detail":{"code":"RATE_LIMIT_EXCEEDED","message":"Rate limit exceeded."}}';
    }

    location @iam_too_large {
        default_type application/json;
        return 413 '{"detail":"Request body exceeds 32 KiB."}';
    }

    location @iam_rate_limited {
        default_type application/json;
        return 429 '{"detail":"Rate limit exceeded."}';
    }

}

server {
    listen 80;
    server_name fuda.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fuda.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fuda.com.br;

    ssl_certificate /etc/letsencrypt/live/fuda.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuda.com.br/privkey.pem;

    root /var/www/fuda;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
