server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name infralab.fuda.com.br fuda.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
